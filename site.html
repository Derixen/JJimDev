<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JJim.dev | Site Layout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    class="jimbg min-h-screen flex items-start justify-center font-sans antialiased"
  >
    <div
      class="grid grid-cols-1 md:grid-cols-4 gap-4 max-w-5xl mx-auto w-full px-4 mt-8"
    >
      <div
        class="md:col-span-4 jimboxbg p-4 rounded-xl border border-slate-700 text-center"
      >
        <div
          id="site-heading"
          class="jim-title-text tracking-wider text-slate-500"
        ></div>
        <div id="site-description" class="jim-subtitle-text"></div>
      </div>

      <div
        class="md:col-span-1 jimboxbg p-6 rounded-xl border border-slate-700"
      >
        <div id="button-container" class="flex flex-col gap-4 w-full"></div>
      </div>

      <div
        class="md:col-span-3 jimboxbg p-6 rounded-xl border border-slate-700 text-slate-200"
      >
        <div id="main-content-display">
          <h3
            id="site-subtitle"
            class="text-xl font-bold mb-2 text-white border-b border-slate-700 pb-2"
          ></h3>

          <!-- Added 'whitespace-pre-line' here -->
          <p
            id="site-subdescription"
            class="text-slate-300 mt-2 leading-relaxed whitespace-pre-line"
          ></p>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
