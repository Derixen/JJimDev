<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jim.dev | Site Layout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class="grid grid-cols-1 md:grid-cols-4 gap-4 max-w-5xl mx-auto w-full px-4 mt-0"
    >
      <!-- Language Switcher -->
      <div
        class="col-span-1 md:col-span-4 flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200 justify-self-end w-fit"
        role="group"
        aria-label="Website language"
      >
        <button
          type="button"
          data-language="en"
          class="language-btn px-4 py-1 text-xs font-bold rounded-lg transition-all cursor-pointer"
        >
          EN
        </button>

        <button
          type="button"
          data-language="de"
          class="language-btn px-4 py-1 text-xs font-bold rounded-lg transition-all cursor-pointer"
        >
          DE
        </button>
      </div>
      <!-- Row 1: Title Container -->
      <div
        class="md:col-span-4 header-card px-6 py-5 flex items-center justify-between gap-4"
      >
        <!-- Title & Subtitle Text (Left Aligned) -->
        <div class="flex flex-col justify-center text-left">
          <h1 id="site-heading" class="site-title px-3 py-1">
            Janos Robert Friedrich
          </h1>
          <p
            id="main-subheading"
            class="site-subheading border-b-4 border-sky-600 pb-2 mb-2 w-fit"
          >
            Enterprise Systems Architect & Infrastructure Engineer
          </p>
        </div>

        <div class="flex flex-col items-center gap-3 shrink-0">
          <!-- Profile Image -->
          <button
            type="button"
            aria-label="View personal profile"
            onclick="openProfileModal()"
            class="w-24 h-24 md:w-28 md:h-28 rounded-2xl border-1 border-slate-200/90 shadow-md flex items-center justify-center overflow-hidden group cursor-pointer transition-all duration-300 ease-in-out hover:border-sky-300 hover:shadow-[0_6px_20px_rgba(59,130,246,0.25)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-800 focus-visible:ring-offset-2"
          >
            <img
              src="images/profile.png"
              alt="Janos Robert Friedrich"
              class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
              onerror="
                this.onerror = null;
                this.parentElement.innerHTML =
                  '<span class=\'text-2xl font-black text-sky-400\'>JF</span>';
              "
            />
          </button>
        </div>
      </div>

      <!-- Row 2: Description Box -->
      <div
        class="md:col-span-4 bg-white/90 backdrop-blur-md border border-slate-200/90 rounded-2xl p-4 shadow-2xs hover:shadow-sm transition-all duration-200 flex items-center justify-center text-center"
      >
        <div
          id="site-description"
          class="text-sm md:text-base italic text-slate-600 leading-relaxed"
        ></div>
      </div>

      <!-- Row 3: Stats Grid -->
      <div id="stats-grid-container" class="md:col-span-4"></div>

      <!-- Row 4 - Left: Navigation Sidebar -->
      <div class="md:col-span-1 sidebar-card">
        <div id="button-container" class="sidebar-menu"></div>
      </div>

      <!-- Row 4 - Right: Main Display Panel -->
      <div class="md:col-span-3 content-card">
        <div id="main-content-display">
          <h3 id="site-subtitle" class="content-title"></h3>
          <div id="site-subdescription" class="content-body"></div>
        </div>
      </div>
    </div>

    <!-- Dynamic stat details dialog -->
    <div
      id="stat-modal"
      class="fixed inset-0 z-[60] hidden items-center justify-center p-4 sm:p-6"
      aria-hidden="true"
    >
      <div
        id="stat-modal-backdrop"
        class="absolute inset-0 bg-slate-950/65 backdrop-blur-md"
      ></div>
      <section
        id="stat-modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="stat-modal-title"
        tabindex="-1"
        class="relative z-10 w-full max-w-2xl max-h-[85vh] overflow-y-auto rounded-3xl border border-slate-200 bg-white p-6 sm:p-8 shadow-2xl"
      >
        <div class="flex items-start justify-between gap-4 mb-5">
          <div class="flex items-center gap-3">
            <span
              id="stat-modal-icon"
              class="flex items-center justify-center rounded-xl bg-sky-50 p-3 text-sky-600"
            ></span>
            <div>
              <p
                id="stat-modal-category"
                class="text-xs uppercase tracking-widest font-bold text-sky-600"
              ></p>
              <h2
                id="stat-modal-title"
                class="text-2xl font-extrabold text-slate-900"
              ></h2>
            </div>
          </div>
          <button
            id="stat-modal-close"
            type="button"
            aria-label="Close details"
            class="rounded-xl px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold"
          >
            ✕
          </button>
        </div>
        <p id="stat-modal-summary" class="text-slate-600 mb-5"></p>
        <div id="stat-modal-sections" class="grid gap-3"></div>
      </section>
    </div>

    <script src="app.js"></script>

    <!-- Image Lightbox Modal -->
    <div
      id="image-modal"
      class="fixed inset-0 z-50 hidden bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 cursor-pointer"
      onclick="closeModal()"
    >
      <div
        class="relative max-w-5xl max-h-[90vh] flex items-center justify-center"
      >
        <img
          id="modal-img"
          src=""
          alt="Enlarged View"
          class="max-w-full max-h-[85vh] rounded-xl shadow-2xl object-contain border border-slate-700"
        />
        <button
          onclick="closeModal()"
          class="absolute -top-10 right-0 text-white hover:text-sky-400 font-bold text-sm bg-slate-800/80 px-3 py-1 rounded-lg border border-slate-700"
        >
          Close ✕
        </button>
      </div>
    </div>
  </body>
</html>
