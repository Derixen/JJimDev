<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jim.dev | Site Layout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    class="jimbg min-h-screen flex items-start justify-center pt-8 font-sans antialiased"
  >
    <div
      class="grid grid-cols-1 md:grid-cols-4 gap-4 max-w-5xl mx-auto w-full px-4 mt-8"
    >
      <!-- Row 1: Title Container (Name) -->
      <div
        class="md:col-span-4 jimboxbg p-6 rounded-2xl text-center flex flex-col items-center justify-center gap-1"
      >
        <h1
          id="site-heading"
          class="text-3xl md:text-4xl font-extrabold text-[#0B192C] tracking-tight"
        ></h1>
        <p
          id="main-subheading"
          class="text-base md:text-lg font-semibold text-[#0066B2] tracking-wide mt-0.5"
        ></p>
      </div>

      <!-- Row 2: Subtitle Container -->
      <div
        class="md:col-span-4 jimboxbg p-4 rounded-xl border border-slate-200 text-center"
      >
        <div id="site-description" class="jim-subtitle-text"></div>
      </div>

      <!-- Row 3: Independent Stats Grid Row -->
      <div id="stats-grid-container" class="md:col-span-4"></div>

      <!-- Row 4 - Left: Navigation Sidebar -->
      <div
        class="md:col-span-1 jimboxbg p-6 rounded-xl border border-slate-200"
      >
        <div id="button-container" class="flex flex-col gap-4 w-full"></div>
      </div>

      <!-- Row 4 - Right: Main Content Display Area -->
      <div
        class="md:col-span-3 jimboxbg p-6 rounded-xl border border-slate-200 text-slate-200"
      >
        <div id="main-content-display">
          <h3
            id="site-subtitle"
            class="text-xl font-bold mb-2 text-white border-b border-slate-700 pb-2"
          ></h3>

          <div
            id="site-subdescription"
            class="text-slate-600 mt-2 leading-relaxed"
          ></div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
