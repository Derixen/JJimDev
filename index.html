<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JJim.dev | Full-Stack Developer</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    class="jimbg min-h-screen flex items-center justify-center font-sans antialiased"
  >
    <div
      class="max-w-md mx-4 p-8 bg-slate-800 rounded-2xl shadow-2xl border border-slate-800/50 text-center backdrop-blur-sm"
    >
      <!-- Avatar Icon -->
      <div
        class="w-16 h-16 border-2 highlight-avatar rounded-full flex items-center justify-center text-3xl font-extrabold mx-auto mb-4 text-slate-400"
      >
        <span class="text-slate-200">J</span>
      </div>

      <!-- Main Heading (Bright White for High Contrast) -->
      <h1 id="main-heading" class="text-3xl jim-title-text mb-2">
        Welcome to
        <span class="text-slate-400 font-extrabold">Jim's </span>
        Profile
      </h1>

      <!-- Sub-Heading (Readable Slate Tone) -->
      <p
        id="sub-heading"
        class="jim-subtitle-text text-sm mb-6 text-slate-400"
      ></p>

      <!-- Button Container -->
      <div id="button-container" class="flex flex-col gap-4 w-full"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
