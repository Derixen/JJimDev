<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hā Lomi - Template</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="template.css" />
  </head>
  <body class="pb-28">
    <div id="petal-container"></div>

    <div class="max-w-2xl mx-auto px-4 pt-6 space-y-6">
      <header class="flex items-center justify-between py-2">
        <div class="flex items-center gap-2">
          <div
            class="w-12 h-12 rounded-full overflow-hidden shrink-0 flex items-center justify-center border border-custom"
          >
            <img
              id="header-logo"
              src="Template/icon.png"
              alt="Logo"
              class="w-full h-full object-cover"
            />
          </div>
          <div>
            <h1 id="header-title" class="font-serif-custom leading-none"></h1>
            <p
              id="header-subtitle"
              class="text-[9px] font-semibold tracking-wider uppercase mt-0.5"
              style="color: var(--color-text-accent)"
            ></p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="header-avatar cursor-pointer">
            <img
              src="Template/profile.png"
              class="w-full h-full object-cover"
              alt="User Avatar"
            />
          </div>
        </div>
      </header>

      <section class="space-y-3">
        <div class="space-y-1.5">
          <p
            id="hero-tagline"
            class="text-[10px] font-bold tracking-widest uppercase"
            style="color: var(--color-text-accent)"
          ></p>
          <h2 id="hero-title" class="font-serif-custom font-normal"></h2>
          <div id="hero-desc" class="text-xs leading-relaxed opacity-90"></div>
        </div>

        <div
          class="relative rounded-2xl overflow-hidden shadow-sm h-64 group border-custom border"
        >
          <div
            id="hero-carousel-container"
            class="absolute inset-0 w-full h-full"
          ></div>

          <div
            class="relative z-10 inset-0 h-full bg-gradient-to-t from-black/80 via-black/30 to-transparent flex flex-col justify-between p-4 pointer-events-none"
          >
            <div class="self-end pointer-events-auto">
              <span id="hero-badge" class="badge-glass"></span>
            </div>

            <div class="text-white space-y-2">
              <div>
                <p
                  id="hero-overlay-tag"
                  class="text-[9px] font-semibold tracking-wider uppercase opacity-80"
                ></p>
                <h3
                  id="hero-overlay-title"
                  class="font-serif-custom text-xl font-medium mt-0.5"
                ></h3>
              </div>
              <div
                id="hero-dots-container"
                class="flex items-center gap-1.5 pt-1 pointer-events-auto"
              ></div>
            </div>
          </div>
        </div>
      </section>

      <section class="card-soft flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 rounded-xl btn-primary flex items-center justify-center shrink-0 shadow-sm"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"
              />
            </svg>
          </div>
          <div>
            <h4 id="audio-title" class="text-xs font-bold"></h4>
            <p id="audio-subtitle" class="text-[11px] opacity-70 mt-0.5"></p>
          </div>
        </div>

        <button
          id="audio-btn"
          class="px-3.5 py-1.5 btn-primary text-xs font-medium shrink-0 cursor-pointer active:scale-95 shadow-sm"
        >
          <span id="audio-btn-icon">🔊</span>
          <span id="audio-btn-text"></span>
        </button>
      </section>

      <section class="space-y-3">
        <div class="flex items-center justify-between">
          <div>
            <h3 id="features-title" class="font-serif-custom font-normal"></h3>
          </div>
        </div>

        <div id="features-container" class="space-y-3"></div>
      </section>

      <section class="space-y-3">
        <div class="flex items-center justify-between">
          <div>
            <h3 id="healers-title" class="font-serif-custom font-normal"></h3>
          </div>
          <span
            id="healers-subtitle"
            class="text-xs font-medium opacity-70"
          ></span>
        </div>

        <div id="healers-container" class="space-y-3"></div>
      </section>
    </div>

    <nav class="bottom-nav">
      <div
        id="nav-container"
        class="max-w-md mx-auto flex items-center justify-between px-6"
      ></div>
    </nav>

    <template id="feature-card-template">
      <div
        class="card-soft card-hover flex gap-4 items-start shadow-sm transition-all duration-300 cursor-pointer"
      >
        <div
          class="feature-img-box w-12 h-12 rounded-xl overflow-hidden shrink-0 hidden"
        >
          <img class="feature-img w-full h-full object-cover" src="" alt="" />
        </div>
        <div
          class="feature-icon-box w-12 h-12 rounded-xl btn-primary flex items-center justify-center text-xl font-serif-custom shrink-0 hidden"
        >
          <span class="feature-icon"></span>
        </div>
        <div class="space-y-1.5 flex-1">
          <div class="flex items-center justify-between">
            <h4 class="feature-item-title text-sm font-bold"></h4>
            <span
              class="feature-toggle-arrow toggle-arrow text-[10px] opacity-60 hidden"
              >▼</span
            >
          </div>

          <div
            class="feature-item-desc text-xs opacity-80 leading-relaxed"
          ></div>

          <div
            class="feature-item-extended expandable-content text-xs opacity-90 leading-relaxed border-t border-dashed border-custom/40"
          ></div>

          <div class="feature-tags flex flex-wrap gap-1.5 pt-1"></div>
        </div>
      </div>
    </template>

    <template id="healer-card-template">
      <div class="card-soft space-y-3 shadow-sm">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img
              class="healer-avatar w-10 h-10 rounded-full object-cover border-custom border"
              src=""
              alt=""
            />
            <div>
              <h4 class="healer-name text-sm font-bold"></h4>
              <p
                class="healer-role text-[11px] font-medium"
                style="color: var(--color-text-accent)"
              ></p>
              <p
                class="healer-exp text-[10px] font-medium opacity-60 mt-0.5"
              ></p>
            </div>
          </div>
          <div
            class="flex items-center gap-1 bg-black/5 px-2 py-0.5 rounded-full text-xs font-bold"
          >
            <span class="text-amber-500 text-[10px]">★</span>
            <span class="healer-rating"></span>
          </div>
        </div>
        <p
          class="healer-bio text-xs opacity-80 leading-relaxed border-t border-custom/30 pt-3"
        ></p>
      </div>
    </template>

    <audio id="bg-audio" loop preload="auto">
      <source src="audio/sample.mp3" type="audio/mpeg" />
    </audio>

    <script src="template.js"></script>

    <div
      id="booking-modal"
      class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/60 backdrop-blur-sm hidden"
    >
      <div
        class="relative w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden border-custom border flex flex-col max-h-[90vh]"
        style="background-color: var(--color-bg)"
      >
        <div
          class="flex items-center justify-between p-4 border-b border-custom/40 shrink-0"
        >
          <h3 class="font-serif-custom text-lg font-bold">Időpontfoglalás</h3>
          <button
            id="close-booking-modal"
            class="p-1 rounded-full opacity-70 hover:opacity-100 transition-opacity cursor-pointer"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div class="p-1 sm:p-3 overflow-y-auto flex-1 w-full bg-white">
          <iframe
            id="calendar-iframe"
            src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2RP9w17xsmeHLf_YLRSNOK4rYd1clJ4Na8CVe_v89MoEpKAK7TjAhauL8oU4iAiBpuE2AMoDvI?gv=true"
            style="border: 0"
            width="100%"
            class="w-full min-h-[680px] h-full rounded-lg"
            frameborder="0"
            scrolling="yes"
          ></iframe>
        </div>
      </div>
    </div>

    <div
      id="profile-modal"
      class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm hidden"
    >
      <div
        class="card-soft relative w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden border-custom border p-6 space-y-4"
        style="background-color: var(--color-bg)"
      >
        <button
          id="close-profile-modal"
          class="absolute top-3 right-3 p-1 rounded-full opacity-70 hover:opacity-100 transition-opacity cursor-pointer"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>

        <div class="flex items-center gap-4 border-b border-custom/30 pb-4">
          <img
            id="profile-avatar"
            src=""
            alt=""
            class="w-16 h-16 rounded-full object-cover border-2 border-custom shadow-md"
          />
          <div>
            <h3
              id="profile-name"
              class="font-serif-custom text-xl font-bold"
            ></h3>
            <p
              id="profile-role"
              class="text-xs font-semibold uppercase tracking-wider mt-0.5"
              style="color: var(--color-text-accent)"
            ></p>
            <p id="profile-age" class="text-xs opacity-70"></p>
          </div>
        </div>

        <div class="space-y-2 text-xs leading-relaxed opacity-90">
          <p id="profile-about-title" class="font-semibold text-sm"></p>
          <p
            class="italic bg-black/5 p-3 rounded-xl border border-custom/20"
            id="profile-about-quote"
          ></p>
        </div>
      </div>
    </div>
  </body>
</html>
