<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hā Lomi - Template</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Template Stylesheet -->
    <link rel="stylesheet" href="template.css" />
  </head>
  <body class="text-stone-800 pb-28">
    <div class="max-w-2xl mx-auto px-4 pt-6 space-y-6">
      <!-- Header Bar -->
      <header class="flex items-center justify-between py-2">
        <div class="flex items-center gap-2">
          <div
            class="w-8 h-8 rounded-full overflow-hidden shrink-0 flex items-center justify-center"
          >
            <img
              src="Template/icon.png"
              alt="Logo"
              class="w-full h-full object-cover"
            />
          </div>
          <div>
            <h1
              id="header-title"
              class="font-serif-custom text-lg font-bold text-stone-900 leading-none"
            ></h1>
            <p
              id="header-subtitle"
              class="text-[9px] font-semibold tracking-wider text-stone-500 uppercase mt-0.5"
            ></p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="header-avatar cursor-pointer">
            <img
              src="Template/profile.png"
              class="w-full h-full object-cover"
              alt="User Avatar"
            />
          </div>
        </div>
      </header>

      <!-- Hero Section -->
      <section class="space-y-3">
        <div>
          <p
            id="hero-tagline"
            class="text-[10px] font-bold tracking-widest text-stone-500 uppercase"
          ></p>
          <h2
            id="hero-title"
            class="font-serif-custom text-2xl font-normal text-stone-900 mt-1"
          ></h2>
          <p
            id="hero-desc"
            class="text-xs text-stone-600 leading-relaxed mt-2"
          ></p>
        </div>

        <!-- Banner Image Card -->
        <div
          class="relative rounded-2xl overflow-hidden shadow-sm h-64 bg-stone-200 group"
        >
          <!-- Képek konténere (Crossfade effekt) -->
          <div
            id="hero-carousel-container"
            class="absolute inset-0 w-full h-full"
          >
            <!-- A JS ide szúrja be a képeket dinamikusan -->
          </div>

          <!-- Sötétítő Gradiens & Szövegek Overlay -->
          <div
            class="relative z-10 inset-0 h-full bg-gradient-to-t from-black/70 via-black/20 to-transparent flex flex-col justify-between p-4 pointer-events-none"
          >
            <div class="self-end pointer-events-auto">
              <span id="hero-badge" class="badge-glass"></span>
            </div>

            <div class="text-white space-y-2">
              <div>
                <p
                  id="hero-overlay-tag"
                  class="text-[9px] font-semibold tracking-wider uppercase opacity-80"
                ></p>
                <h3
                  id="hero-overlay-title"
                  class="font-serif-custom text-xl font-medium mt-0.5"
                ></h3>
              </div>

              <!-- Pöttyök (Indicators: . . . . . . .) -->
              <div
                id="hero-dots-container"
                class="flex items-center gap-1.5 pt-1 pointer-events-auto"
              >
                <!-- A JS ide generálja a pöttyöket -->
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Audio Bar -->
      <section
        class="bg-stone-200/60 border border-stone-300/50 rounded-2xl p-3.5 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 rounded-xl bg-emerald-900 text-emerald-100 flex items-center justify-center shrink-0"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"
              />
            </svg>
          </div>
          <div>
            <h4 id="audio-title" class="text-xs font-bold text-stone-900"></h4>
            <p
              id="audio-subtitle"
              class="text-[11px] text-stone-500 mt-0.5"
            ></p>
          </div>
        </div>

        <button
          id="audio-btn"
          class="px-3.5 py-1.5 bg-stone-300/70 hover:bg-stone-300 text-stone-800 text-xs font-medium rounded-full transition-colors flex items-center gap-1.5 shrink-0 cursor-pointer active:scale-95"
        >
          <span id="audio-btn-icon">🔊</span>
          <span id="audio-btn-text"></span>
        </button>
      </section>

      <!-- Features Section -->
      <section class="space-y-3">
        <div class="flex items-center justify-between">
          <div>
            <p
              id="features-category"
              class="text-[10px] font-bold tracking-widest text-stone-500 uppercase"
            ></p>
            <h3
              id="features-title"
              class="font-serif-custom text-xl font-normal text-stone-900"
            ></h3>
          </div>
          <button class="p-1.5 rounded-full bg-stone-200/60 text-stone-600">
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 6v6m0 0v6m0-6h6m-6 0H6"
              />
            </svg>
          </button>
        </div>

        <!-- Dinamikus funkció-kártyák konténere -->
        <div id="features-container" class="space-y-3"></div>
      </section>

      <!-- Master Healers Section -->
      <section class="space-y-3">
        <div class="flex items-center justify-between">
          <div>
            <p
              id="healers-category"
              class="text-[10px] font-bold tracking-widest text-stone-500 uppercase"
            ></p>
            <h3
              id="healers-title"
              class="font-serif-custom text-xl font-normal text-stone-900"
            ></h3>
          </div>
          <span
            id="healers-subtitle"
            class="text-xs text-stone-500 font-medium"
          ></span>
        </div>

        <!-- Dinamikus gyógyító-kártyák konténere -->
        <div id="healers-container" class="space-y-3"></div>
      </section>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <div
        id="nav-container"
        class="max-w-md mx-auto flex items-center justify-between"
      ></div>
    </nav>

    <!-- HTML Sabil sablon a dinamikus elemek másolásához (Template Elements) -->
    <template id="feature-card-template">
      <div class="card-soft flex gap-4 items-start">
        <div
          class="feature-img-box w-12 h-12 rounded-xl overflow-hidden shrink-0 bg-stone-300 hidden"
        >
          <img class="feature-img w-full h-full object-cover" src="" alt="" />
        </div>
        <div
          class="feature-icon-box w-12 h-12 rounded-xl bg-stone-300/70 flex items-center justify-center text-xl text-stone-700 font-serif-custom shrink-0 hidden"
        >
          <span class="feature-icon"></span>
        </div>
        <div class="space-y-1.5 flex-1">
          <h4 class="feature-item-title text-sm font-bold text-stone-900"></h4>
          <p
            class="feature-item-desc text-xs text-stone-600 leading-relaxed"
          ></p>
          <div class="feature-tags flex flex-wrap gap-1.5 pt-1"></div>
        </div>
      </div>
    </template>

    <template id="healer-card-template">
      <div class="card-soft space-y-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img
              class="healer-avatar w-10 h-10 rounded-full object-cover border border-stone-300"
              src=""
              alt=""
            />
            <div>
              <h4 class="healer-name text-sm font-bold text-stone-900"></h4>
              <p class="healer-role text-[11px] text-stone-500"></p>
              <p
                class="healer-exp text-[10px] font-medium text-stone-400 mt-0.5"
              ></p>
            </div>
          </div>
          <div
            class="flex items-center gap-1 bg-stone-300/50 px-2 py-0.5 rounded-full text-xs text-stone-700 font-bold"
          >
            <span class="text-amber-600 text-[10px]">★</span>
            <span class="healer-rating"></span>
          </div>
        </div>
        <p
          class="healer-bio text-xs text-stone-600 leading-relaxed border-t border-stone-300/40 pt-3"
        ></p>
      </div>
    </template>

    <!-- Background Audio Element -->
    <audio id="bg-audio" loop preload="auto">
      <source src="audio/sample.mp3" type="audio/mpeg" />
    </audio>

    <!-- External JavaScript File -->
    <script src="template.js"></script>
  </body>
</html>
